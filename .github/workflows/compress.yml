name: Optimize Images
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'images/**.jpg'
      - 'images/**.jpeg'
      - 'images/**.png'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Fix Rotation and Resize
        run: |
          find images -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) -exec mogrify -auto-orient -resize '1200x1200>' -quality 82 {} +
          
      - name: Save to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Fixed rotation and resized images for web"
