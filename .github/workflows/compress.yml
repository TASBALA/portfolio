name: Optimize Images
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'images/**.jpg'
      - 'images/**.jpeg'
      - 'images/**.png'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Install and Process
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          shopt -s nullglob nocaseglob
          for img in images/*.jpg images/*.jpeg images/*.png; do
            echo "Processing $img..."
            mogrify -auto-orient -resize '1200x1200>' -quality 82 "$img" || echo "WARNING: Failed to process $img"
          done
          
      - name: Save to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Fixed rotation and resized images for web"
